services:
  - type: web
    name: milk-daily-essentials-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false

  - type: web
    name: milk-daily-essentials-storefront
    runtime: static
    rootDir: storefront
    buildCommand: echo "No build step required"
    staticPublishPath: .
