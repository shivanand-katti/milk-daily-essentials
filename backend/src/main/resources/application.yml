server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: milk-essentials-api
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/milk_essentials}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      connection-timeout: 30000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health
