name: Backend CI

on:
  push:
    branches:
      - main
      - "feature/**"
    paths:
      - "backend/**"
      - "database/migrations/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "backend/**"
      - "database/migrations/**"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DB_URL: jdbc:mysql://localhost:3306/milk_essentials?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC
      DB_USERNAME: milk_app
      DB_PASSWORD: test_password
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: milk_essentials
          MYSQL_USER: milk_app
          MYSQL_PASSWORD: test_password
          MYSQL_ROOT_PASSWORD: root_test_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_test_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=30s
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: backend/pom.xml

      - name: Compile and test backend
        run: mvn --batch-mode --no-transfer-progress -f backend/pom.xml verify

      - name: Start API and smoke-test database-backed endpoints
        shell: bash
        run: |
          set -euo pipefail
          mvn --batch-mode --no-transfer-progress -f backend/pom.xml spring-boot:run > backend-api.log 2>&1 &
          api_pid=$!
          trap 'kill "$api_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/api/v1/health >/dev/null; then
              ready=1
              break
            fi
            sleep 2
          done

          if [ "$ready" -ne 1 ]; then
            cat backend-api.log
            exit 1
          fi

          curl --silent --show-error --fail http://localhost:8080/api/v1/health | jq -e '.status == "UP"'
          curl --silent --show-error --fail http://localhost:8080/api/v1/categories | jq -e 'length >= 4'
          curl --silent --show-error --fail "http://localhost:8080/api/v1/products?search=milk" | jq -e '.totalElements >= 2'
